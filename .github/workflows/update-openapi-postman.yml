name: Generate OpenAPI and Upload to Postman & Apidog

on:
  push:
    branches:
      - develop

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Run application in background
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application to start
        run: |
          echo "Esperando que la aplicación esté disponible..."
          sleep 30

      - name: Download OpenAPI spec
        run: |
          curl http://localhost:8080/v3/api-docs.yaml -o openapi.yaml

      - name: Stop application
        run: |
          kill $(cat app.pid)

      - name: Upload OpenAPI to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}
        run: |
          echo "📤 Subiendo a Postman..."
          OPENAPI_CONTENT=$(cat openapi.yaml)
          curl --location --request POST 'https://api.getpostman.com/import/openapi' \
          --header "X-Api-Key: $POSTMAN_API_KEY" \
          --header "Content-Type: application/json" \
          --data-raw "$(jq -n \
            --arg input "$OPENAPI_CONTENT" \
            --arg type "string" \
            --arg workspace "$POSTMAN_WORKSPACE_ID" \
            '{input: $input, type: $type, workspace: $workspace}')"

      - name: Upload OpenAPI to Apidog
        env:
          APIDOG_TOKEN: ${{ secrets.APIDOG_TOKEN }}
          APIDOG_PROJECT_ID: ${{ secrets.APIDOG_PROJECT_ID }}
        run: |
          echo "📤 Subiendo a Apidog..."
          OPENAPI_CONTENT=$(cat openapi.yaml | jq -Rs .)
          curl --location --request POST "https://api.apidog.com/v1/projects/${APIDOG_PROJECT_ID}/import-openapi" \
          --header "Authorization: Bearer $APIDOG_TOKEN" \
          --header "X-Apidog-Api-Version: 2024-03-28" \
          --header "Content-Type: application/json" \
          --data-raw "{
            \"input\": $OPENAPI_CONTENT,
            \"options\": {
              \"endpointOverwriteBehavior\": \"OVERWRITE_EXISTING\",
              \"schemaOverwriteBehavior\": \"OVERWRITE_EXISTING\",
              \"updateFolderOfChangedEndpoint\": false
            }
          }"
